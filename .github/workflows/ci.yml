name: CI Prod - simple pull
on:
  push:             # Triggers automatically when code is pushed
    branches: [main]
  #workflow_dispatch: # Triggers a manual button in the GitHub UI

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    #env:
      #ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: ${{ vars.ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION }}
      
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          #port: ${{ vars.SSH_PORT }}
          script: |
            cd /home/umkacid/public_html
            git pull origin main
            chown -R umkacid:umkacid ./e-info
            
      - name: Run a text script
        run: echo "The GitHub Action is running successfully!"
